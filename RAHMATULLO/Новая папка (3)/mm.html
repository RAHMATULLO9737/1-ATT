<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Carousel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; }
        .carousel {
            position: relative;
            width: 80%;
            max-width: 600px;
            margin: auto;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .slides {
            display: flex;
            width: 300%;
            animation: slide 9s infinite;
        }
        .slide {
            width: 100%;
            flex-shrink: 0;
        }
        img {
            width: 100%;
            display: block;
        }
        @keyframes slide {
            0% { transform: translateX(0); }
            33.33% { transform: translateX(-100%); }
            66.66% { transform: translateX(-200%); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div class="carousel">
        <div class="slides">
            <div class="slide"><img src="Howling+wolf-haileyherrera.jpg" alt="Slide 1"></div>
            <div class="slide"><img src="Howling+wolf-haileyherrera.jpg" alt="Slide 2"></div>
            <div class="slide"><img src="Howling+wolf-haileyherrera.jpg" alt="Slide 3"></div>
        </div>
    </div>
</body>
</html>
